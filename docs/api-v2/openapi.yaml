    AnalyzeRequestPointingWarm:
      summary: Pointing-model client, WARM phase (multipart; this is the `request` part plus a Rice FITS `image` part)
      value:
        request:
          client_frame_id: "run_01JB7Q2A:017:0"
          ops: [detect, solve]
          frame:
            exposure_s: 2.0
            t_start_utc: "2026-10-19T03:12:43.512Z"
            binning: [2, 2]
            filter: L
            calibrated: true
          hint:
            phase: warm
            center:
              ra_deg: 83.8221
              dec_deg: -5.3911
              radius_deg: 0.25
            scale:
              arcsec_per_px: 1.12
              rel_tol: 0.05
            parity: 1
            star_motion:
              length_px: 0.4
              angle_deg: null
            fwhm_px: 3.1
          detection:
