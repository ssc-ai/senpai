openapi: 3.1.0
info:
  title: senpai API
  version: 2.0.0-draft.1
  summary: Detection, plate solving, photometry and seeing for ground-based telescope frames.
  description: |
    Normative contract for the senpai v2 HTTP API. The server, the `senpai-client` package,
    the `senpai.v2` models used in-process, and the contract-validated test fake are all
    generated from or validated against this document.

    Companion documents in this directory:

    - `README.md`: conventions (pixel origin, WCS, angles, time, units), error model,
      idempotency, sync vs jobs, auth, limits, v1 migration.
    - `versioning-and-provenance.md`: version axes, pinning, compatibility windows and the
      provenance block.

    `info.version` is the revision of this document. The API contract version a server
    implements is `MAJOR.MINOR` (here `2.0`). It is sent in the `Senpai-Api-Version` response
    header and reported by `GET /v2/capabilities`.

    Response enums are open. Every enum that can appear in a response carries
    `x-extensible-enum: true` (shared enums such as `SolveTier` and `Operation` carry
    `x-extensible-enum: responses`: strict in requests, open in responses). Generated clients
    must map an unknown value to a raw-string fallback instead of raising; the FakeServer has a
    mode that emits unknown enum values so client CI checks this.

    Every response, including errors and `204`s, carries `Senpai-Api-Version` and
    `Senpai-Request-Id`.

    Every `{job_id}`, `{result_id}`, table URL, SSE stream, `upload:<id>` reference and
    `{pixel_sha256}` lookup is filtered by the caller's tenant. An id that belongs to another
    tenant returns `404 not-found`, never `403`, so ids cannot be probed. Each operation's
    `security` lists the scope it needs; a token without it gets `403 forbidden`.

    Status: DRAFT for owner review, 2026-10-19. Not implemented.
  contact:
    name: senpai maintainers
    url: https://github.com/ssc-ai/senpai
  x-api-contract-version: "2.0"
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://{host}
    description: Hosted or self-hosted server behind TLS.
    variables:
      host:
        default: senpai.example.org
        description: Placeholder. The hosted endpoint name is an open question.
  - url: http://127.0.0.1:8765
    description: Local profile (localhost service on the observatory PC).
security:
  - bearerAuth: []
tags:
  - name: meta
    description: Health, capabilities and the contract itself.
  - name: frames
    description: Single-frame analysis (the bounded synchronous route) and solve-from-sources.
  - name: jobs
    description: Asynchronous work (single frames, multi-frame collects, batches).
  - name: results
    description: Retrieval of retained results and bulk tables.
  - name: data
    description: Uploads and data-ownership operations on retained frames.
  - name: v1-deprecated
    description: |
      senpai 2.x routes, kept during the v1 deprecation window. Request and response bodies
      are those of senpai 2.8 and are not repeated here; "unchanged" refers to bodies only.
      From senpai 3.0 the v1 handlers sit behind the same auth (tenant and scopes),
      `capabilities.limits`, rate limits, killable worker pool and tenant default retention as
      v2. On `hosted`, v1 is enabled per tenant (default off). Every v1 response carries
      `Deprecation`, `Link; rel="deprecation"` and, once scheduled, `Sunset`; after the sunset
      date hosted answers `410 api-version-gone`.

paths:
  /v2/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Readiness
      description: |
        `200` when the server can accept work (`ok` or `degraded`), `503` when it cannot.
        `degraded` means some capability is down (for example the astrometry.net tier) while
        others work; check `GET /v2/capabilities` for what is ready. Unauthenticated callers
        get `status` only; `api_version`, `server_version` and `checks` are returned only with
        a valid token, or on the `local` profile. Served from the event loop, never blocked by
        frame processing.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Ready (possibly degraded).
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Not ready.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v2/health/live:
    get:
      tags: [meta]
      operationId: getLiveness
      summary: Liveness (process is up)
      security:
        - {}
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
  /v2/capabilities:
    get:
      tags: [meta]
      operationId: getCapabilities
      summary: Versions, pipelines, formats, limits, tiers, bundles and policies
      description: |
        Everything a client needs to decide whether this server can do the work: API version,
        software build, served algorithm versions, enabled solve tiers, active data bundles,
        limits and data policies. Never contains filesystem paths or secrets. Cacheable with
        `ETag`. Unauthenticated on the `local` profile; requires a token elsewhere.

        `limits` and `policies` are the caller's **effective** values: the server-wide
        limits, narrowed by the caller's tenant limits (`limits.per_tenant`).
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Capabilities.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
              examples:
                selfHosted:
                  $ref: "#/components/examples/CapabilitiesSelfHosted"
        "304":
          description: Not modified.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v2/openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApi
      summary: This contract, as served
      description: Byte-identical (after JSON conversion) to the checked-in `docs/api-v2/openapi.yaml` of the running release. CI enforces this.
      security:
        - {}
      responses:
        "200":
          description: OpenAPI document.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                type: object

  /v2/analyze:
    post:
      tags: [frames]
      operationId: analyzeFrame
      summary: Analyze one frame (bounded synchronous; the slew-loop route)
      security:
        - bearerAuth: [analyze]
      description: |
        Detect sources in one frame and, depending on `ops`, plate-solve it and measure
        seeing, photometry and moving-object streaks. One frame per request; the frame is
        always solved on its own (never through a collect's shift chain).

        Deadline: `min(Prefer: wait, request.deadline_s, limits.sync_max_deadline_s)`. The
        deadline clock starts when the request body has been fully received; upload time is
        not part of it. Clients size their transport timeout as transfer estimate + deadline +
        a margin. A request whose `solve.timeout_s` is below the deadline gets a `200` with the
        slow rung reported as `attempts[].status: timeout`, not a `504`.

        - Without `Prefer: respond-async`, a request that misses the deadline gets `504
          deadline-exceeded` and its worker is killed. Nothing keeps running.
        - With `Prefer: respond-async, wait=N` (RFC 7240), a request still running after `N`
          seconds is turned into a job: `202` with `Location` and `Preference-Applied:
          respond-async`. Only if `capabilities.policies.async_promotion` is true (default
          false on `hosted`). A promoted request keeps its sync worker for at most
          `limits.promoted_max_s` and counts against the caller's per-tenant sync concurrency
          until it finishes; past that it fails with `deadline-exceeded` in the job.
        - On servers that set `limits.sync_tier_budget_s`, a tier whose budget is exhausted is
          reported as `attempts[].status: timeout`; blind solves that need more belong on
          `POST /v2/jobs`.

        If no sync worker is free within `limits.overload_reject_ms` (default 1000) the server
        returns `503 overloaded` so the client can fall back; the sync pool never queues behind
        batch work. Admission to the sync pool is by tenant fair share.

        Unavailable solve tiers: tiers in `solve.tiers` that this server cannot run are
        skipped and listed in `solution.attempts[]` with `status: skipped` and `reason:
        tier-unavailable:<T>`; the solve proceeds with the available tiers and the result is
        `200`. `solution.status: not_attempted` with `reason: tier-unavailable` means none of
        the requested tiers is available under `planner: auto`. Only `planner: explicit` naming
        a tier this server does not serve returns `422 tier-unavailable`.

        "Processed but not solved" is `200` with `solution.status` set. 4xx/5xx mean the
        request or the server failed, never that the sky did not cooperate.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
        - $ref: "#/components/parameters/ApiMinMinor"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnalyzeMultipart"
            encoding:
              request:
                contentType: application/json
              image:
                contentType: application/fits, application/octet-stream, application/gzip
            examples:
              pointingWarm:
                $ref: "#/components/examples/AnalyzeRequestPointingWarm"
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeRequest"
            examples:
              byReference:
                $ref: "#/components/examples/AnalyzeRequestByRef"
      responses:
        "200":
          $ref: "#/components/responses/FrameResultOk"
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/DeadlineExceeded"

  /v2/solve/sources:
    post:
      tags: [frames]
      operationId: solveSources
      summary: Plate-solve a detection list (no image)
      security:
        - bearerAuth: [analyze]
      description: |
        Successor of `POST /astrometry/solve/sources`. For clients that detect locally
        (low-bandwidth mode) or bring their own detector. Sources are 0-based pixel
        coordinates; the server converts for astroeasy. `hint.scale` is honoured (v1 silently
        ignored its FoV hint). Same bounded-sync, deadline and tier rules as `/v2/analyze`.
        `pin.algorithm` must name `senpai.sources-solve` (or be a bare integer or channel
        alias); a pin naming another pipeline is `400 invalid-request`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Prefer"
        - $ref: "#/components/parameters/ApiMinMinor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcesSolveRequest"
      responses:
        "200":
          description: Processed. Check `solution.status`.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
            Senpai-Replayed:
              $ref: "#/components/headers/SenpaiReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcesSolveResult"
            application/vnd.senpai.v2+msgpack:
              schema:
                $ref: "#/components/schemas/SourcesSolveResult"
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/DeadlineExceeded"

  /v2/jobs:
    post:
      tags: [jobs]
      operationId: createJob
      summary: Submit an asynchronous job (frame, collect or sources)
      security:
        - bearerAuth: [jobs]
      description: |
        `kind: frame` takes an `AnalyzeRequest`; `kind: collect` takes a `CollectRequest`
        with one image part per frame, named `image.<client_frame_id>` (or `image.ref` per
        frame); `kind: sources` takes a `SourcesSolveRequest`.

        A collect solves the first sidereal frame that solves and propagates the WCS to the
        other frames along the shift chain unless `collect.solve_every_frame` is true. Each
        frame's `wcs_status` says which happened. Pointing-model clients must use
        `/v2/analyze` (one frame per request), not collects.

        A repeated `Idempotency-Key` with the same fingerprint returns `202` with the existing
        job's `Location` in every job state (queued, running or finished); `409
        idempotency-in-flight` applies only to the sync routes. Where
        `capabilities.policies.idempotency_required` lists this route, a request without the
        header gets `400 idempotency-key-missing`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ApiMinMinor"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/JobMultipart"
            encoding:
              request:
                contentType: application/json
              image:
                contentType: application/fits, application/octet-stream, application/gzip
          application/json:
            schema:
              $ref: "#/components/schemas/JobRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v2/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job status
      description: Status monitor. Kept at least `capabilities.policies.job_ttl_h` after completion. Poll after `Retry-After`. Tenant-scoped (a foreign id is `404`).
      security:
        - bearerAuth: [jobs]
      responses:
        "200":
          description: Job status.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [jobs]
      operationId: cancelJob
      summary: Cancel a job and purge its inputs and result
      security:
        - bearerAuth: ["data:delete"]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/jobs/{job_id}/events:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: Server-sent events for a job
      security:
        - bearerAuth: [jobs]
      description: |
        `text/event-stream`. Event names: `state` (data: `Job`), `progress` (data: `JobProgress`),
        `frame_done` (data: `FrameResult` for one frame of a collect, in completion order),
        `done` (data: `Job`). Supports `Last-Event-ID` for resumption. Available when
        `capabilities.jobs.sse` is true.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Event stream.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: progress
                id: 7
                data: {"frames_done": 3, "frames_total": 12, "fraction": 0.25}

        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v2/results/{result_id}:
    parameters:
      - $ref: "#/components/parameters/ResultId"
    get:
      tags: [results]
      operationId: getResult
      summary: A retained result (frame, collect or sources-solve)
      description: Available while the result is retained under the applied data policy (`data_policy_applied.retain_until`). Tenant-scoped.
      security:
        - bearerAuth: ["results:read"]
      responses:
        "200":
          description: The stored result, identical to what was first returned.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyResult"
            application/vnd.senpai.v2+msgpack:
              schema:
                $ref: "#/components/schemas/AnyResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [results]
      operationId: deleteResult
      summary: Delete a retained result now
      description: Deletes the result and its tables. An audit row remains for `policies.audit_retention_days` with the fields listed in `docs/deployment.md` section 8 (ids, timestamps, version axes, `pixel_sha256`; no hint, WCS, detections or pixels).
      security:
        - bearerAuth: ["data:delete"]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v2/results/{result_id}/tables/{table}:
    parameters:
      - $ref: "#/components/parameters/ResultId"
      - $ref: "#/components/parameters/TableName"
    get:
      tags: [results]
      operationId: getResultTable
      summary: Bulk table of a retained result
      security:
        - bearerAuth: ["results:read"]
      description: |
        Large lists in columnar form. `Accept: application/vnd.apache.arrow.stream` (preferred
        for large tables), `application/vnd.senpai.v2+msgpack`, or `application/json` (an
        array of row objects). Column names and units equal the corresponding JSON fields.
        For collects, every row carries `client_frame_id`.
      responses:
        "200":
          description: Table.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/vnd.apache.arrow.stream:
              schema:
                type: string
                contentMediaType: application/vnd.apache.arrow.stream
            application/vnd.senpai.v2+msgpack:
              schema:
                type: string
                contentMediaType: application/vnd.senpai.v2+msgpack
            application/json:
              schema:
                type: array
                items:
                  type: object
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v2/uploads:
    post:
      tags: [data]
      operationId: createUpload
      summary: Get a presigned upload slot for a large frame or a collect
      security:
        - bearerAuth: [analyze]
      description: |
        Only when `capabilities.inputs.image_ref.uploads` is true (hosted, or a self-host with
        an object store). PUT the bytes to `upload_url`, then reference `image_ref.uri` in an
        analyze request or job. The checksum is enforced by the store.

        The `upload:<id>` is bound to (tenant, sha256): only the creating tenant can reference
        it, and only for bytes with that hash. An object never referenced is deleted at
        `expires_at`; once referenced it follows the referencing request's data policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadSlotRequest"
      responses:
        "201":
          description: Upload slot.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSlot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableContent"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v2/frames/{pixel_sha256}:
    parameters:
      - $ref: "#/components/parameters/PixelSha256"
    get:
      tags: [data]
      operationId: getFrameRecord
      summary: What this server holds for a frame (data ownership)
      description: Retention status, linked results, holds (e.g. a consented shadow evaluation) and contribution grants for this tenant only.
      security:
        - bearerAuth: ["results:read"]
      responses:
        "200":
          description: Frame record.
          headers:
            Senpai-Api-Version:
              $ref: "#/components/headers/SenpaiApiVersion"
            Senpai-Request-Id:
              $ref: "#/components/headers/SenpaiRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrameRecord"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [data]
      operationId: deleteFrame
      summary: Delete a retained frame, its derived results, and revoke contribution
      description: |
        Removes the frame bytes and the tenant's results for it. A contribution grant is
        revoked: the frame is removed from future evaluation and training sets. Models already
        trained are not retrained (stated in the contribution terms).
      security:
        - bearerAuth: ["data:delete"]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
