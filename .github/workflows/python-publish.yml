# Build and publish senpai to PyPI when a GitHub Release is published, along
# with astro-senpai (its old PyPI name) as an empty package pinned to the same
# senpai version (packaging/astro-senpai/).
#
# Trigger:   publishing a Release (not merges to main, not draft releases,
#            not prereleases -- see the `if:` guard on release-build).
# Auth:      PyPI Trusted Publishing (OIDC). No API token secret is used.
# Gate:      the `pypi` environment. Add required reviewers there so a human
#            must approve before anything reaches PyPI.
#
# One-time setup required before this can succeed -- see docs/RELEASING.md.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-build:
    # Never publish from a draft or a prerelease. Publishing a draft flips
    # `draft` to false before this fires, so the prerelease check is the one
    # that does the real work; the draft check is belt-and-braces.
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    env:
      # PyPI project names. The shim's built artifacts normalize `-` to `_`.
      DIST_NAME: senpai
      SHIM_NAME: astro-senpai
      SHIM_FILE: astro_senpai
      SHIM_DIR: packaging/astro-senpai

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the exact commit the release tag points at, not the
          # branch head, so we build what was actually tagged.
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Sets UV_PYTHON so `uv sync` and `uv run` agree on the interpreter.
          python-version: "3.12"

      - name: Verify release tag matches pyproject.toml version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PROJECT_VERSION="$(uv run --no-project python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "pyproject.toml version: ${PROJECT_VERSION}"
          echo "release tag:            ${TAG}"
          if [ "${TAG}" != "v${PROJECT_VERSION}" ]; then
            echo "::error::Release tag '${TAG}' does not match pyproject.toml version '${PROJECT_VERSION}' (expected tag 'v${PROJECT_VERSION}'). Bump the version or retag."
            exit 1
          fi
          echo "VERSION=${PROJECT_VERSION}" >> "$GITHUB_ENV"

      - name: Verify astro-senpai shim is pinned to this version
        run: |
          uv run --no-project python - <<'EOF'
          import os, pathlib, tomllib
          version = os.environ["VERSION"]
          shim = tomllib.loads(pathlib.Path(os.environ["SHIM_DIR"], "pyproject.toml").read_text())["project"]
          want = f"senpai=={version}"
          if shim["version"] != version or shim["dependencies"] != [want]:
              raise SystemExit(f"::error::{os.environ['SHIM_DIR']}/pyproject.toml must have version = \"{version}\" and dependencies = [\"{want}\"], got version {shim['version']!r}, dependencies {shim['dependencies']!r}.")
          print(f"shim OK: astro-senpai {version} -> {want}")
          EOF

      - name: Verify version is not already on PyPI
        run: |
          for name in "${DIST_NAME}" "${SHIM_NAME}"; do
            if curl -sf "https://pypi.org/pypi/${name}/${VERSION}/json" > /dev/null; then
              echo "::error::${name} ${VERSION} is already published on PyPI. Bump the version in pyproject.toml and ${SHIM_DIR}/pyproject.toml -- PyPI will not accept a re-upload."
              exit 1
            fi
          done
          echo "PyPI check OK: ${VERSION} is not yet published"

      - name: Install dependencies
        # No --frozen: uv.lock is gitignored in this repo, so there is nothing
        # to freeze against.
        run: uv sync --all-extras

      - name: Lint
        # Same narrow rule set as ci.yml. The full `make lint` config reports
        # ~850 pre-existing findings, so gating releases on it would block
        # every release until that backlog is cleared.
        run: uv run ruff check senpai --select E9,F63,F7,F82,F401,F541,F811

      - name: Run tests
        # Same subset as `make test-ci`: astrometry.net, index files, and local
        # star catalogs are not available on GitHub runners.
        run: uv run pytest -v -m "not requires_astrometry and not requires_catalog"

      - name: Build release distributions
        run: |
          uv build --out-dir dist/senpai
          uv build --out-dir dist/astro-senpai "${SHIM_DIR}"

      - name: Verify built artifacts carry the expected version
        run: |
          ls -lR dist/
          for f in "senpai/${DIST_NAME}-${VERSION}-py3-none-any.whl" "senpai/${DIST_NAME}-${VERSION}.tar.gz" \
                   "astro-senpai/${SHIM_FILE}-${VERSION}-py3-none-any.whl" "astro-senpai/${SHIM_FILE}-${VERSION}.tar.gz"; do
            test -f "dist/${f}" || { echo "::error::Expected dist/${f}, got: $(ls -R dist/)"; exit 1; }
          done

      - name: Check distribution metadata
        run: uvx twine check dist/senpai/* dist/astro-senpai/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build

    permissions:
      # Mandatory for trusted publishing.
      id-token: write

    # Configure required reviewers on this environment in
    # Settings -> Environments -> pypi. The build above runs unattended;
    # this job waits for a human approval before uploading.
    environment:
      name: pypi
      url: https://pypi.org/p/senpai

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      # senpai first: the astro-senpai shim depends on it. skip-existing lets
      # a re-run of this job finish the shim upload if senpai already went up;
      # the build job has already refused versions that were on PyPI before.
      - name: Publish senpai to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/senpai/
          skip-existing: true

      - name: Publish astro-senpai shim to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/astro-senpai/
          skip-existing: true
